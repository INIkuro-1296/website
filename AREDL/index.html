        var data = [];

        async function getData(){
            const response = await fetch('https://api.aredl.net/v2/api/aredl/levels/');
            if(!response.ok){
                throw new Error(`HTTP error! status: ${response.status}`);

            }
            data = await response.json();

        }

        async function loaduser(){
            
            const response = await fetch('user.json');
            user = await response.json();
            console.log(user);
            let userdatas = "";
            for (let i = 0; i < user.length; i++) {
                userdatas = userdatas + `<option value="${i}">${user[i].name}</option>`;
                
            }
            document.getElementById("player").innerHTML = userdatas;
           

        }

        async function loadexd(){
            
            const response = await fetch('exd.json');
            exd = await response.json();
            console.log(exd);
            exdvictory = [];
            for (let i = 0; i < data.length; i++) {
                exdvictory.push({name: "", id: data[i].id,victor: []});    
            }
            
            for (let i = 0; i < exd.length; i++) {
                const index = exdvictory.findIndex(level => level.id === exd[i].level_uuid);
                if(index!=-1){
                    exdvictory[index].victor.push(user[user.findIndex(user => user.UUID === exd[i].id)]);
                    exdvictory[index].name = data[index].name;

                }

                
            }
            console.log(exdvictory)
            document.getElementById('aredllist').innerHTML = "";
            let addinglist = "";
            for (let i = 0; i < data.length; i++) {
                if(data[i].status!="Legacy"&&exdvictory[i].name!=""){
                    let level_victors = "";
                    for(let j = 0; j < exdvictory[i].victor.length; j++){
                        level_victors = level_victors + exdvictory[i].victor[j].name + ",";
                    }
                    addinglist = addinglist + `<tr class="list"><td>${Number(i) + 1}</td><td>${data[i].name}</td><td>${level_victors}</td></tr>`;
                }
            }
            document.getElementById('aredllist').innerHTML = addinglist;
        }

        
        getData();


        loaduser();
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        async function main() {
        console.log("処理スタート");

        // 例: 2000ミリ秒（2秒）待つ
        await sleep(500);
        loadexd();
        console.log("2秒経過後に実行");
        }

        main();
        
        var level_uuid = "";
        document.getElementById("level_id_input").addEventListener('change', () => {
            let answer_level = -1;
            for (let i = 0; i < data.length; i++) {
                if(data[i].level_id==document.getElementById("level_id_input").value){
                    answer_level = i;
                    break;
                }
            }

            if(answer_level==-1){
                document.getElementById("id_level_name").innerHTML = "!NOT FOUND!";
                level_uuid = "";
            }else{
                document.getElementById("id_level_name").innerHTML = `${data[answer_level].position}: ${data[answer_level].name}`;
                level_uuid = data[answer_level].id
            }

        });

        function copies(){

                "level_id": ${Number(document.getElementById("level_id_input").value)},
                "level_uuid": "${level_uuid}"
            }`);

        }
